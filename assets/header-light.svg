<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients: Ghibli Parchment & Watercolor -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>

    <!-- Terracotta Warm Glow -->
    <radialGradient id="terracottaGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#B84E26" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0" />
    </radialGradient>

    <!-- Forest Green Soft Glow -->
    <radialGradient id="forestGlow" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#2A6647" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title-l { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 34px; fill: #1C232B; letter-spacing: -0.5px; }
    .tagline-l { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 15px; fill: #3B4654; }
    .mono-l { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #566373; }
    .badge-text-l { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .status-text-l { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #2A6647; letter-spacing: 0.5px; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#bgGradLight)" stroke="#E5E7EB" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#terracottaGlow)" />
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#forestGlow)" />

  <!-- Subtle Constellation Lines -->
  <g stroke="#3B4654" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3,3">
    <line x1="50" y1="90" x2="250" y2="90" />
    <line x1="250" y1="90" x2="330" y2="40" />
    <line x1="650" y1="180" x2="820" y2="180" />
  </g>

  <!-- Top System Badge -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="18" cy="13" r="4.5" fill="#2A6647" />
    <circle cx="18" cy="13" r="2" fill="#FFFFFF" />
    <text x="32" y="17" class="status-text-l">DEVOPS &amp; RUNTIME SECURITY</text>
    <text x="212" y="17" class="mono-l" fill="#566373">·</text>
    <text x="224" y="17" class="mono-l" fill="#B84E26">h3n-x.dev</text>
  </g>

  <!-- Header Content -->
  <text x="50" y="105" class="title-l">Henry Pacheco</text>
  <text x="315" y="105" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#566373">/ h3n-x</text>

  <text x="50" y="136" class="tagline-l">
    DevOps &amp; Infrastructure Engineer <tspan fill="#B84E26">✦</tspan> Linux Internals, Hardened Containers &amp; DevSecOps
  </text>
  <text x="50" y="160" class="mono-l" fill="#566373">
    Automating resilient systems from kernel primitives to strict CI/CD quality gates.
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(50, 195)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#3B4654" />
      <text x="30" y="21" class="badge-text-l" fill="#1C232B">Linux &amp; systemd</text>
      <text x="142" y="21" class="mono-l">cgroups</text>
    </g>
    <g transform="translate(197, 0)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#266A8C" />
      <text x="30" y="21" class="badge-text-l" fill="#1C232B">Docker &amp; CIS v1.6</text>
      <text x="156" y="21" class="mono-l" fill="#266A8C">audit</text>
    </g>
    <g transform="translate(404, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#B84E26" />
      <text x="30" y="21" class="badge-text-l" fill="#1C232B">CI/CD &amp; Actions</text>
      <text x="145" y="21" class="mono-l" fill="#B84E26">SARIF</text>
    </g>
    <g transform="translate(606, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#2A6647" />
      <text x="30" y="21" class="badge-text-l" fill="#1C232B">Python &amp; Bash</text>
      <text x="135" y="21" class="mono-l" fill="#2A6647">0 CVEs</text>
    </g>
  </g>
</svg>